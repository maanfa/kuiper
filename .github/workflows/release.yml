name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install dependencies
        run: pnpm install

      - name: Build & Package
        run: pnpm dist

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            release/KuiperBox-setup-win-x64-*.exe
            release/KuiperBox-portable-win-x64-*.7z
          body: |
            ## 功能

            - **地形切片生成器** — GeoTIFF 高程数据转换为 Cesium Quantized Mesh 瓦片
            - **地形切片转换器** — 瓦片目录与 `.cztr` 容器互转
            - **3DTiles 转换器** — 3DTiles 数据集与 `.czts` 容器互转
            - **文件查看器** — 浏览 `.cztr` / `.czts` 文件内容
            - **静态托管服务** — 将容器文件以 RESTful API 形式暴露 HTTP 服务
            - **静态文件服务** — 本地目录 HTTP 文件托管
            - **任务中心** — 统一管理后台任务和服务

            ## 系统要求

            - Windows 10 / Windows 11
            - 地形切片生成器需 JDK 21+（应用内可一键下载）

            ## 下载

            - `KuiperBox-setup-win-x64-{version}.exe` — NSIS 安装包
            - `KuiperBox-portable-win-x64-{version}.7z` — 便携版

            ## 许可

            本项目采用 [MIT 许可证](LICENSE) 开源。使用了 20+ 个第三方开源软件（Electron、Vue、Naive UI、Hono 等），详见仓库内 [LICENSE](LICENSE) 文件。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
