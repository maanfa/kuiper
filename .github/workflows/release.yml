name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install dependencies
        run: pnpm install

      - name: Build & Package
        run: pnpm dist

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/KuiperBox-setup-win-x64-*.exe
            release/KuiperBox-portable-win-x64-*.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
