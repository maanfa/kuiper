appId: com.maanfa.kuiper-box
productName: kuiper-box
directories:
  output: release
electronDownload:
  cache: .cache/electron
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: out/main/task/tile-worker.js
    to: task/tile-worker.js
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: 'KuiperBox-setup-${os}-${arch}-${version}.${ext}'
files:
  - out/**/*
  - package.json
  - "!node_modules"
