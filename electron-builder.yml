appId: com.maanfa.kuiper-box
productName: kuiper-box
directories:
  output: release
electronDownload:
  cache: .cache/electron
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: 'KuiperBox-setup-${os}-${arch}-${version}.${ext}'
files:
  - out/**/*
