appId: com.maanfa.kuiper-box
productName: kuiper-box
directories:
  output: release
electronDownload:
  cache: .cache/electron
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
extraResources:
  - from: resources/icon.png
    to: icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: 'KuiperBox-setup-${os}-${arch}-${version}.${ext}'
files:
  - out/**/*
